<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earned Trust: Trust Ladder prototype (Team Voltaire)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12302C;--ink2:#1E4A44;--ink3:#2A5A53;--saff:#E3A33B;--saff2:#F4D08F;
    --paper:#F3F7F6;--tint:#E8F0EE;--line:#D5E0DC;--muted:#596966;--soft:#B9CFC9;
    --green:#2E7D5B;--orange:#C9772B;--red:#B5432F;
    --disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
    --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --ease:cubic-bezier(.22,.8,.24,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;margin:0;text-wrap:balance}
  button{font:inherit;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--tint);color:var(--ink);font-weight:600;transition:background .18s,transform .12s,box-shadow .18s}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--saff);color:var(--ink)}
  button.primary:hover{background:#ECB352}
  button.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
  button.ghost:hover{background:var(--tint)}
  :focus-visible{outline:3px solid var(--saff);outline-offset:2px}
  .skip{position:absolute;left:-999px;top:8px;background:var(--saff);color:var(--ink);padding:8px 12px;border-radius:8px;z-index:99}
  .skip:focus{left:8px}

  /* ---------- top bar */
  .chrome{position:sticky;top:0;z-index:15}
  .top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:20px;padding:12px 28px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand svg{flex:none}
  .brand h1{font-size:21px;font-weight:800;line-height:1.1}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
  .tabs{display:flex;gap:2px;background:var(--ink2);padding:4px;border-radius:14px;margin:0 auto}
  .tabs button{background:transparent;color:var(--soft);padding:8px 14px;border-radius:10px;white-space:nowrap}
  .tabs button:hover{color:#fff}
  .tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
  .acts{display:flex;gap:8px;align-items:center}
  .acts .ghost{color:#fff;box-shadow:inset 0 0 0 1.5px var(--ink3)}
  .acts .ghost:hover{background:var(--ink2)}
  .eli5btn{background:var(--saff);color:var(--ink);display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px}
  .eli5btn:hover{background:#ECB352}
  .eli5btn .bulb{width:18px;height:18px}

  /* ---------- time bar */
  .timebar{background:#fff;border-bottom:1px solid var(--line);padding:10px 28px 12px}
  .tb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .play{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--ink);color:#fff;flex:none}
  .play:hover{background:var(--ink2)}
  .play svg{width:18px;height:18px}
  .sm{padding:7px 12px;font-size:13.5px}
  .wkbox{min-width:92px;line-height:1.15}
  .wkbox b{font-family:var(--disp);font-size:20px;display:block}
  .wkbox span{font-size:12px;color:var(--muted)}
  .scrub{flex:1;min-width:260px;position:relative;padding:4px 0 22px}
  .scrub input{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--saff) var(--p,0%),var(--tint) var(--p,0%));cursor:pointer}
  .scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink);transition:transform .15s}
  .scrub input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
  .scrub input:active::-webkit-slider-thumb{transform:scale(1.2)}
  .marks{position:absolute;left:10px;right:10px;top:18px;height:20px}
  .mark{position:absolute;left:calc(var(--f)*100%);transform:translateX(-50%);background:none;padding:2px 4px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;border-radius:6px}
  .mark::before{content:"";display:block;width:2px;height:6px;background:var(--line);margin:0 auto 1px}
  .mark:hover,.mark.on{color:var(--ink)}
  .mark.on::before{background:var(--saff)}
  .mark:first-child{transform:none;left:-6px}.mark:last-child{transform:translateX(-100%);left:calc(100% + 6px)}
  .mark:first-child::before{margin-left:4px}.mark:last-child::before{margin-right:4px}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:1px;height:1px}
  .switch span{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:background .2s}
  .switch span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
  .switch input:checked+span{background:var(--ink)}
  .switch input:checked+span::after{transform:translateX(14px)}
  .switch input:focus-visible+span{outline:3px solid var(--saff);outline-offset:2px}
  .narr{margin:8px 0 0;padding:9px 14px;border-radius:12px;background:var(--paper);font-size:14px;border-left:4px solid var(--line);min-height:40px}
  .narr.learn{border-color:var(--saff);background:#FDF4E3}
  .narr.bad{border-color:var(--red);background:#FBEDEA}
  .narr.good{border-color:var(--green);background:#EAF4EE}
  .narr .nw{font-family:var(--disp);margin-right:6px}
  .narr .more{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .narr.swap{animation:swap .45s var(--ease)}
  @keyframes swap{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* ---------- shared */
  .view.enter{animation:enter .4s var(--ease)}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,163,59,.6)}100%{box-shadow:0 0 0 12px rgba(227,163,59,0)}}
  .meta{font-size:12.5px;color:var(--muted)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;position:relative}
  .panel>h2,.ph{font-size:17px;display:flex;align-items:center;gap:8px;margin:0 0 10px}
  .info{margin-left:auto;width:28px;height:28px;padding:0;border-radius:50%;font-weight:700;font-size:13px;flex:none;background:var(--tint)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .OK{background:#E1F0E8;color:var(--green)} .ASK{background:#FBEACB;color:#7A4E0E} .SLOW{background:#F6DCC6;color:#8E4A12}
  .STOP{background:#F3D3CC;color:#9A3A28} .CLOSED{background:var(--red);color:#fff} .BLOCKED{background:#3a1d18;color:#fff} .NEW{background:var(--tint);color:var(--muted)}
  .truth{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .tr-honest{background:#E1F0E8;color:var(--green)} .tr-renter{background:#FBEACB;color:#7A4E0E} .tr-mixer{background:#F6DCC6;color:#8E4A12} .tr-front,.tr-stealth{background:#F3D3CC;color:#9A3A28}

  /* ---------- scoreboard */
  .score{display:grid;grid-template-columns:3fr 2fr;gap:14px;padding:18px 28px 0}
  .grp{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 18px 14px}
  .grp h3{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .grp.calm{background:#EAF4EE;border-color:#CFE5D8}
  .ms{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:14px}
  .m b{display:block;font-family:var(--disp);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .m>span{font-size:12.5px;color:var(--muted);display:block;max-width:24ch}
  .m.bump b{animation:bump .5s var(--ease)}
  @keyframes bump{40%{color:var(--orange)}}

  /* ---------- dashboard */
  main.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;padding:14px 28px 28px}
  .tablebox{overflow-x:auto;margin:0 -6px}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid #EEF3F1;vertical-align:middle}
  tr.row{cursor:pointer;transition:background .15s}
  tr.row:hover{background:#F6FAF9}
  tr.sel{background:#FFF7E8 !important;box-shadow:inset 4px 0 0 var(--saff)}
  .mbtn{background:none;padding:2px 0;text-align:left;font-weight:600;border-radius:4px}
  .mbtn:hover{text-decoration:underline;text-underline-offset:3px}
  .lvl{display:inline-flex;gap:2px;align-items:flex-end;height:16px;vertical-align:middle}
  .lvl i{display:block;width:6px;background:var(--line);border-radius:2px}
  .lvl i.on{background:var(--ink2)} .lvl i.top{background:var(--saff)}
  .t{display:inline-block;min-width:22px;height:22px;border-radius:11px;font-size:11px;font-weight:700;line-height:22px;text-align:center;margin-right:3px;background:#EEF3F1;color:#8A9895;padding:0 5px;transition:background .25s,color .25s}
  .t.on{background:var(--ink);color:#fff} .t.r{background:var(--orange);color:#fff}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
  .panel{min-width:0} main.dash>*{min-width:0}
  .side{display:flex;flex-direction:column;gap:14px;min-width:0}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
  .kv div{background:var(--paper);border-radius:12px;padding:8px 10px}
  .kv b{display:block;font-family:var(--disp);font-size:18px}
  .kv span{font-size:11.5px;color:var(--muted)}
  .why{font-size:13.5px;color:var(--ink2);line-height:1.5;padding-left:18px;margin:10px 0 0}
  .why li{margin-bottom:4px}
  .log{max-height:290px;overflow:auto;font-size:13px;line-height:1.5;padding-right:4px}
  .log p{margin:0 0 8px;padding:2px 0 2px 12px;border-left:3px solid var(--line)}
  .log p.learn{border-color:var(--saff)} .log p.bad{border-color:var(--red)} .log p.good{border-color:var(--green)}
  .log p.now{background:var(--paper);border-radius:0 8px 8px 0}
  svg .dot{transition:r .25s var(--ease)}

  /* ---------- merchant app */
  .two{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:28px;padding:22px 28px 28px;align-items:start}
  .pick{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .pick select{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);flex:1}
  .phone{width:100%;max-width:380px;border:10px solid var(--ink);border-radius:40px;padding:16px 14px 22px;background:#fff;min-height:640px;position:relative}
  .phone::before{content:"";display:block;width:90px;height:6px;border-radius:6px;background:var(--line);margin:0 auto 12px}
  .phone .bar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .phone .shopname{font-family:var(--disp);font-size:18px;margin-bottom:10px}
  .card{background:var(--paper);border-radius:16px;padding:12px 14px;margin-bottom:10px;animation:pop .35s var(--ease) both}
  .card:nth-of-type(2){animation-delay:.05s}.card:nth-of-type(3){animation-delay:.1s}.card:nth-of-type(4){animation-delay:.15s}
  .card.dark{background:var(--ink);color:#fff}
  .card.warn{background:#FBEACB}
  .card.bad{background:#F3D3CC}
  .card h3{margin:0 0 6px;font-size:17px}
  .prog{height:10px;background:#fff;border-radius:6px;overflow:hidden;margin:8px 0 6px}
  .prog i{display:block;height:100%;background:var(--saff);border-radius:6px;transition:width .7s var(--ease)}
  .steps{display:flex;gap:4px;margin:8px 0}
  .steps span{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:8px;background:#fff;color:var(--muted);font-weight:700}
  .steps span.on{background:var(--ink2);color:#fff} .steps span.cur{background:var(--saff);color:var(--ink);animation:pulse 1.8s infinite}
  .task{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
  .task i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
  .task.done i{background:var(--green);border-color:var(--green)}
  .explain{font-size:15px;line-height:1.6;max-width:68ch}
  .explain h2{font-size:24px;margin:0 0 8px}
  .explain h3{font-size:18px;margin:18px 0 8px}
  .tl{border-left:3px solid var(--line);margin:12px 0 12px 6px;padding-left:18px}
  .tl div{position:relative;margin-bottom:14px}
  .tl div::before{content:"";position:absolute;left:-26px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--line);border:2px solid var(--paper)}
  .tl div.done::before{background:var(--green)} .tl div.now::before{background:var(--saff);animation:pulse 1.8s infinite}
  .tl div.future{color:var(--muted)}
  .try{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .try button{margin:6px 6px 0 0;font-size:13px;padding:6px 10px}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:6px}
  .chk.newp{background:#FDF4E3;border-color:var(--saff2);animation:pop .45s var(--ease) both}

  /* ---------- explained tab */
  .exp{padding:22px 28px 28px;display:grid;gap:18px}
  .chapcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .chapcard{text-align:left;background:var(--ink);color:#fff;border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
  .chapcard:hover{background:var(--ink2)}
  .chapcard h2{font-size:24px}
  .chapcard p{margin:0;color:var(--soft);font-weight:400;grid-column:1}
  .chapcard .go{grid-row:1/3;grid-column:2;width:48px;height:48px;border-radius:50%;background:var(--saff);color:var(--ink);display:grid;place-items:center;font-size:20px}
  .chapcard.light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
  .chapcard.light:hover{background:var(--tint)}
  .chapcard.light p{color:var(--muted)}
  ol.four{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}
  ol.four li{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;counter-increment:s}
  ol.four li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--saff);font-family:var(--disp);font-weight:800;margin-bottom:10px}
  ol.four h3{font-size:18px;margin-bottom:6px}
  ol.four p{margin:0;line-height:1.55}

  /* ---------- pop-ups, dialogs, tour */
  .pop{position:absolute;z-index:20;max-width:330px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;font-size:13.5px;line-height:1.5;box-shadow:0 14px 40px rgba(18,48,44,.3);animation:pop .2s var(--ease);font-weight:400;font-family:var(--body)}
  .pop button{margin-top:10px;background:var(--saff);color:var(--ink);padding:5px 12px;display:block}
  .scrim{position:fixed;inset:0;background:rgba(18,48,44,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}}
  .dialog{background:#fff;border-radius:22px;max-width:540px;width:100%;padding:26px 28px;animation:pop .3s var(--ease);box-shadow:0 30px 80px rgba(18,48,44,.35)}
  .dialog h2{margin:0 0 8px;font-size:24px}
  .dialog p{font-size:15px;line-height:1.6;margin:0 0 12px}
  .dialog .dots{display:flex;gap:6px;margin:6px 0 16px}
  .dialog .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:width .25s}
  .dialog .dots i.on{background:var(--saff);width:22px;border-radius:4px}
  .dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .choices{display:grid;gap:8px;margin-top:14px}
  .choices button{text-align:left;padding:14px 16px;border-radius:14px;display:grid;grid-template-columns:1fr auto;align-items:center}
  .choices button small{grid-column:1;font-weight:400;color:var(--muted);font-size:13px}
  .choices button.primary small{color:var(--ink2)}
  .hl{position:relative;z-index:41;box-shadow:0 0 0 4px var(--saff),0 0 0 9999px rgba(18,48,44,.0);border-radius:18px;transition:box-shadow .3s}
  .resume{position:fixed;right:20px;bottom:20px;z-index:30;background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 12px 30px rgba(18,48,44,.35);animation:pop .3s var(--ease);display:flex;gap:10px;align-items:center}
  .resume:hover{background:var(--ink2)}
  .resume span{color:var(--saff)}
  .resume-wrap{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;gap:6px;align-items:center}
  .resume-wrap .resume{position:static}
  .resume-x{width:36px;height:36px;border-radius:50%;padding:0;background:#fff;box-shadow:0 8px 20px rgba(18,48,44,.25)}

  /* ---------- ELI5 explainer */
  .eli-scrim{position:fixed;inset:0;z-index:50;background:rgba(18,48,44,.6);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .25s ease}
  .eli{background:#fff;border-radius:26px;width:min(1040px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.35);animation:pop .35s var(--ease)}
  .eli-top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 20px}
  .chaps{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:14px}
  .chaps button{background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px}
  .chaps button[aria-selected="true"]{background:var(--ink);color:#fff}
  .eli .x{margin-left:auto;width:40px;height:40px;border-radius:50%;padding:0;font-size:22px;line-height:1}
  .eli-bar{height:4px;background:var(--tint);margin:0 20px}
  .eli-bar i{display:block;height:100%;background:var(--saff);border-radius:4px;transition:width .5s var(--ease)}
  .eli-stage{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;padding:24px 32px 10px;align-items:center;overflow:auto;flex:1}
  .eli-art{background:var(--paper);border-radius:22px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
  .eli-art svg{width:100%;height:100%}
  :is(.eli-art,.thart) text{font-family:var(--body)}
  .eli-n{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
  .eli-text h2{font-size:clamp(26px,3.2vw,38px);font-weight:800;line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
  .eli-b{font-size:16.5px;line-height:1.6;margin:0 0 14px;max-width:46ch}
  .eli-like{margin:0 0 16px;padding:10px 14px;background:#FDF4E3;border-radius:12px;font-size:15px;max-width:46ch}
  .eli-like::before{content:"Think of it like this: ";font-weight:700}
  .eli-foot{display:flex;align-items:center;gap:10px;padding:12px 20px 18px}
  .eli-foot .eli-count{margin:0 auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .eli-foot button{min-width:110px;padding:11px 18px}
  .eli-stage.fwd .eli-text>*{animation:slidein .45s var(--ease) both}
  .eli-stage.back .eli-text>*{animation:slideback .45s var(--ease) both}

<p class="note">All shops, payers and amounts are simulated to show how the system behaves. Nothing here is real data. The rules are deliberately simple; a real version would learn them from verified merchants.</p>
<script>
// ---------- seeded random
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const WEEKS=18, START=new Date(2026,6,1), LEARN_WEEK=13;
const wkLabel=w=>{const d=new Date(START);d.setDate(d.getDate()+(w-1)*7);return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})};
const FESTIVE=w=>w>=15&&w<=17;
const CAT={bakery:{sales:60000,ticket:140,input:0.45},kirana:{sales:90000,ticket:260,input:0.75},mobile:{sales:70000,ticket:420,input:0.70}};
const LEVELS=["","Starter","Proven","Verified","Trusted"];
const CAPS=[0,1.6,2.0,2.5,3.0];           // payout limit per level, x what a typical verified shop of that type earns
const NEXT=[0,6,10,14];                     // good weeks needed for Level 2, 3, 4
// type: honest | renter (rented at `at`) | mixer (betting from `at`) | front (onboarded at `at`) | stealth (a new trick, onboarded at `at`)
const M=[
 ["Sri Sai Bakery","Hyderabad","bakery","honest",1],
 ["Ameerpet Oven House","Hyderabad","bakery","honest",1,{festive:true}],
 ["Golden Crust Bakers","Hyderabad","bakery","honest",1],
 ["Banjara Bun Co.","Hyderabad","bakery","honest",1,{catering:10}],
 ["Moonlight Cake Studio","Hyderabad","bakery","front",6,{device:"D-7731"}],
 ["Charminar Sweet Bakes","Hyderabad","bakery","mixer",9],
 ["Lakshmi Kirana","Hyderabad","kirana","honest",1],
 ["Sai Ram General Stores","Hyderabad","kirana","honest",1],
 ["Venkat Provisions","Hyderabad","kirana","renter",7],
 ["New Balaji Kirana","Hyderabad","kirana","front",8],
 ["Hi-Tech Mobiles","Hyderabad","mobile","honest",1],
 ["Cellpoint Accessories","Hyderabad","mobile","renter",5],
 ["Rose Cake Corner","Hyderabad","bakery","stealth",10,{index:true}],
 ["Tolichowki Treats","Hyderabad","bakery","stealth",10],
 ["Mehdipatnam Daily Mart","Hyderabad","kirana","stealth",11],
 ["Bandra Pav House","Mumbai","bakery","honest",1,{festive:true}],
 ["Dadar Bake Shop","Mumbai","bakery","honest",1],
 ["Andheri Fresh Breads","Mumbai","bakery","front",9],
 ["Patel Kirana Stores","Mumbai","kirana","honest",1],
 ["Shree Ganesh Provisions","Mumbai","kirana","honest",1],
 ["Malad Daily Needs","Mumbai","kirana","renter",6],
 ["Kurla Super Mart","Mumbai","kirana","mixer",10],
 ["Mobile Junction Andheri","Mumbai","mobile","honest",1],
 ["Ghatkopar Phone Care","Mumbai","mobile","honest",1],
 ["Link Road Accessories","Mumbai","mobile","front",13,{device:"D-7731"}]
].map((a,i)=>({id:i,name:a[0],city:a[1],cat:a[2],type:a[3],at:a[4],opt:a[5]||{}}));
const isBad=m=>m.type!=="honest";
const isNew=m=>m.type==="front"||m.type==="stealth";
const BET_POOL=420, STEALTH_BASE=5000, STEALTH_POOL=260;
const isGambler=p=>p<BET_POOL||(p>=STEALTH_BASE&&p<STEALTH_BASE+STEALTH_POOL);

// ---------- what the provider would observe each week
function generate(){
  const r=rng(42);
  return M.map(m=>{
    const c=CAT[m.cat], weeks=[];
    const baseScale=0.8+r()*0.4, localPool=(m.city=="Hyderabad"?100000:200000)+m.id*1000;
    for(let w=1;w<=WEEKS;w++){
      if(isNew(m)&&w<m.at){weeks.push(null);continue}
      const noise=0.9+r()*0.2;
      let shop=isNew(m)?0:c.sales*baseScale*noise*(m.type=="renter"?0.45:1);
      const fest=FESTIVE(w)?(m.opt.festive?1.6:1.2):1;
      shop*=fest;
      let inputFactor=(FESTIVE(w+1)&&!FESTIVE(w))?(m.opt.festive?1.5:1.15):fest;
      if(w==17) inputFactor=fest*0.9;
      let proof=isNew(m)?0:c.sales*baseScale*noise*(m.type=="renter"?0.45:1)*c.input*inputFactor*(0.95+r()*0.1);
      let catering=0;
      if(m.opt.catering&&(w==m.opt.catering||w==m.opt.catering+1)){catering=45000;proof+=45000*c.input*0.9}
      let bet=0, betTicket=520, outBet=0.62, nightBet=0.45;
      if(m.type=="front"||((m.type=="renter"||m.type=="mixer")&&w>=m.at)){bet=(m.type=="mixer"?c.sales*0.8:c.sales*(1.3+r()*0.5))*(0.9+r()*0.2)}
      if(m.type=="stealth"){bet=c.sales*(0.9+r()*0.3); betTicket=c.ticket*(1+r()*0.15); outBet=0.04; nightBet=0.05}
      const sales=shop+catering+bet;
      const shopTicket=c.ticket*(0.9+r()*0.2);
      const count=shop/shopTicket+bet/betTicket+(catering?1:0);
      const ticket=sales/Math.max(1,count);
      const share=x=>x/Math.max(1,sales);
      const outState=share(bet)*outBet+share(shop)*0.02;
      const night=share(bet)*nightBet+share(shop)*0.03;
      const payers=new Set();
      const nShop=Math.round(shop/shopTicket/3);
      for(let k=0;k<nShop;k++) payers.add(localPool+Math.floor(r()*600));
      if(bet>0&&m.type!=="stealth"){const nb=110+Math.floor(r()*40);for(let k=0;k<nb;k++) payers.add(Math.floor(r()*BET_POOL))}
      if(m.type=="stealth"){const nb=120+Math.floor(r()*30);for(let k=0;k<nb;k++) payers.add(STEALTH_BASE+Math.floor(r()*STEALTH_POOL))}
      if(catering) payers.add(localPool+999);
      let control=[];
      if(m.type=="renter"&&w>=m.at&&w<m.at+5) control=(w==m.at)?["new device and SIM","payout account changed"]:["logins from Delhi, shop in "+m.city];
      if(m.type=="front") control=["logins from a different city than the shop"];
      weeks.push({w,sales,shop,bet,catering,proof,ticket,outState,night,payers,control});
    }
    return weeks;
  });
}
const RAW=generate();

// ---------- the system: sees only observations, never the type
function run(upto){
  const raw=RAW;
  const st=M.map(()=>({level:1,good:0,strikes:0,tol:{},closed:false,blocked:false,reviewAt:null,flagged:false,unanswered:0,lastAsk:false,hist:[]}));
  const memory={payers:new Set(),devices:new Set()};
  const learned={hop:false};
  const checks=[
    {w:1,q:"Shape",t:"Average payment compared with verified peers"},
    {w:1,q:"Shape",t:"Share of payers from other states"},
    {w:1,q:"Shape",t:"Share of payments at night"},
    {w:1,q:"Shape",t:"Sales compared with similar shops this week"},
    {w:1,q:"Control",t:"Phone, SIM, payout account and login city vs signup"},
    {w:1,q:"Network",t:"Customers shared with shops in other cities"},
    {w:1,q:"Rule",t:"A question left unanswered counts as a yes, and keeps counting"}
  ];
  const log=[]; const met={betTotal:0,betHeld:0,honestDelayed:0,mixedShopHeld:0,honestAsked:new Set(),stopped:0,missedWeeks:0};
  for(let w=1;w<=upto;w++){
    // learn "normal" from shops that are open and not flagged
    const base={};
    for(const cat in CAT){
      const ws=M.filter(m=>m.cat==cat).map(m=>({m,o:raw[m.id][w-1]})).filter(x=>x.o&&!st[x.m.id].closed&&!st[x.m.id].flagged);
      const med=f=>{const v=ws.map(x=>f(x.o)).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:0};
      base[cat]={sales:med(o=>o.sales),ticket:med(o=>o.ticket),outState:med(o=>o.outState),night:med(o=>o.night)};
    }
    const live=M.filter(m=>raw[m.id][w-1]&&!st[m.id].closed);
    // network: links between shops in different cities sharing 8+ payers
    const links=[];
    for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
      const a=raw[live[i].id][w-1].payers,b=raw[live[j].id][w-1].payers;let n=0;for(const p of a) if(b.has(p)) n++;
      if(n>=8) links.push([live[i].id,live[j].id,n,live[i].city!==live[j].city]);
    }
    // payer hopping: how many shops each payer paid this week
    const paid=new Map();
    for(const m of live) for(const p of raw[m.id][w-1].payers){paid.set(p,(paid.get(p)||0)+1)}
    // the index case of the new trick: a cyber-crime tip names one shop
    if(w==LEARN_WEEK){
      const idx=M.find(m=>m.opt.index), s=st[idx.id], o=raw[idx.id][w-1];
      const hop=[...o.payers].filter(p=>paid.get(p)>=2).length/o.payers.size;
      log.push({w,c:"bad",t:`A cyber-crime report (I4C) names <b>${idx.name}</b>. None of the three questions had flagged it: normal amounts, daytime, local payers, owner still in control. An analyst confirms it is a betting front.`});
      log.push({w,c:"learn",t:`<b>New check learned.</b> Comparing it with honest bakeries, one thing stands out: ${Math.round(hop*100)}% of its payers also paid another shop this week (honest shops: 0%). "Payer hopping" is added to the Network question for every shop from now on.`});
      learned.hop=true;
      checks.push({w,q:"Network",t:"Payer hopping: share of payers who also pay other shops in the same week",isNew:true});
      for(const p of o.payers) if(isGambler(p)) memory.payers.add(p);
    }
    for(const m of M){
      const o=raw[m.id][w-1], s=st[m.id];
      if(!o){s.hist.push(null);continue}
      met.betTotal+=o.bet;
      if(s.closed){met.betHeld+=o.bet;s.hist.push({w,sales:o.sales,proofSales:0,paid:0,held:o.sales,action:s.blocked?"BLOCKED":"CLOSED",tests:[],why:[s.blocked?"Blocked at signup":"Account closed after review"],level:0,peer:0});continue}
      if(isNew(m)&&w==m.at&&m.opt.device&&memory.devices.has(m.opt.device)){
        s.blocked=true;s.closed=true;met.betHeld+=o.bet;met.stopped++;
        log.push({w,c:"learn",t:`<b>${m.name}</b> tried to sign up with device ${m.opt.device}, a fingerprint remembered from a confirmed front. Blocked before its first payout.`});
        s.hist.push({w,sales:o.sales,proofSales:0,paid:0,held:o.sales,action:"BLOCKED",tests:[],why:["Device fingerprint matches a confirmed front"],level:0,peer:0});continue;
      }
      if(w==LEARN_WEEK&&m.opt.index){
        s.closed=true;met.stopped++;met.betHeld+=o.bet;
        s.hist.push({w,sales:o.sales,proofSales:0,paid:0,held:o.sales,action:"CLOSED",tests:[],why:["Named in a cyber-crime report; confirmed by an analyst","Its pattern was used to learn a new check"],level:0,peer:0});continue;
      }
      const b=base[m.cat], c=CAT[m.cat], why=[], tests=[];
      // SHAPE: does the money look like this kind of shop? (missing proof is NOT a reason)
      const dev=Math.abs(o.ticket-b.ticket)/b.ticket*0.8+Math.max(0,o.sales/b.sales-1.5)+Math.max(0,o.outState-b.outState)*3+Math.max(0,o.night-b.night)*3;
      const tolerated=s.tol.catering&&o.catering>0;
      if(dev>0.6&&!tolerated){tests.push("S");why.push(`Shape: average payment ₹${Math.round(o.ticket)} vs ₹${Math.round(b.ticket)} at similar shops; ${Math.round(o.outState*100)}% of payers from other states; ${Math.round(o.night*100)}% at night`)}
      // CONTROL
      if(o.control.length){tests.push("C");why.push("Control: "+o.control.join(", "))}
      // NETWORK (+ learned checks)
      const mine=links.filter(l=>l[0]==m.id||l[1]==m.id), far=mine.filter(l=>l[3]);
      let memHits=0;for(const p of o.payers) if(memory.payers.has(p)) memHits++;
      const hopShare=[...o.payers].filter(p=>paid.get(p)>=2).length/Math.max(1,o.payers.size);
      const netWhy=[];
      if(far.length) netWhy.push(`shares customers with ${far.length} shop(s) in another city`);
      if(memHits>=10) netWhy.push(`${memHits} payers previously paid confirmed fronts`);
      if(learned.hop&&hopShare>0.3) netWhy.push(`payer hopping (learned week ${LEARN_WEEK}): ${Math.round(hopShare*100)}% of its payers also paid another shop this week`);
      if(netWhy.length){tests.push("N");why.push("Network: "+netWhy.join("; "))}
      // UNANSWERED QUESTIONS
      if((s.lastAsk||s.unanswered>0)&&m.type!=="honest") s.unanswered++;
      const extra=Math.min(2,s.unanswered);
      if(extra){why.push(`No reply to a question for ${s.unanswered} week(s)`)}
      const yes=Math.min(3,tests.length+extra);
      let action=["OK","ASK","SLOW","STOP"][yes];
      s.flagged=yes>=1;
      if(m.type=="stealth"&&yes==0) met.missedWeeks++;
      // honest shops answer a question with evidence; the system learns not to ask again
      if(action=="ASK"&&m.type=="honest"){met.honestAsked.add(m.id);
        if(o.catering&&!s.tol.catering){log.push({w,c:"good",t:`<b>${m.name}</b> got one friendly question about an unusually large order. Reply: "office catering order" plus the invoice. Cleared the same day, nothing held, and catering is now part of its normal pattern.`});s.tol.catering=true;why.push("Shop replied: office catering order, invoice attached. Cleared.");s.flagged=false}
      }
      s.lastAsk=(action=="ASK");
      // payouts
      const proofSales=o.proof/c.input, gap=Math.max(0,o.sales-proofSales), gapShare=gap/o.sales;
      const cap=b.sales*CAPS[s.level];
      let held=0;
      if(action=="SLOW") held=Math.max(gap,o.sales-cap);
      else if(action=="STOP") held=o.sales;
      else held=Math.max(0,o.sales-cap);
      held=Math.min(o.sales,held);
      const paidNow=o.sales-held;
      if(m.type=="honest") met.honestDelayed+=held;
      const betHeld=Math.min(o.bet,held); met.betHeld+=betHeld;
      if(m.type=="mixer"||m.type=="renter") met.mixedShopHeld+=held-betHeld;
      // ladder
      if(action=="OK"&&gapShare<0.2){s.good++;const lv=s.good>=NEXT[3]?4:s.good>=NEXT[2]?3:s.good>=NEXT[1]?2:1;
        if(lv>s.level){s.level=lv;if(m.type=="honest"&&lv>=3&&(m.id==1||m.id==15)) log.push({w,c:"good",t:`<b>${m.name}</b> climbed to Level ${lv} (${LEVELS[lv]}). Unlocked: ${lv==4?"instant payouts and a working-capital loan offer":"the Verified Shop badge"}.`})}}
      if(action=="SLOW"){if(s.level>1) s.level--;s.good=0;s.strikes++;
        if(s.strikes==1) log.push({w,c:"bad",t:`<b>${m.name}</b>: two signals agree. Only the unexplained ₹${fmt(held)} waits; normal sales keep flowing. Strike 1: a warning and an amnesty offer, in the shop's own language.`});
        if(s.strikes>=3&&!s.reviewAt){s.reviewAt=w;log.push({w,c:"bad",t:`<b>${m.name}</b>: third strike. Loan offer and badge withdrawn on all sales; sent for human review.`})}
      }
      if(action=="STOP"){s.level=1;s.good=0;if(!s.reviewAt){s.reviewAt=w;log.push({w,c:"bad",t:`<b>${m.name}</b>: three signals agree. Payouts paused; an analyst reviews it.`})}}
      if(s.reviewAt&&w>=s.reviewAt+1&&!s.closed){
        s.closed=true;met.stopped++;
        let k=0;for(const p of o.payers) if(isGambler(p)){memory.payers.add(p);k++}
        if(m.opt.device) memory.devices.add(m.opt.device);
        const firstDevice=m.opt.device&&!checks.some(x=>x.t.startsWith("Memory: device"));
        if(firstDevice) checks.push({w,q:"Memory",t:"Memory: device fingerprints of confirmed fronts, checked at signup",isNew:true});
        if(!checks.some(x=>x.t.startsWith("Memory: gamblers"))) checks.push({w,q:"Network",t:"Memory: gamblers' UPI IDs from confirmed fronts",isNew:true});
        log.push({w,c:"learn",t:`Analyst confirmed <b>${m.name}</b>. Closed, and a suspicious transaction report filed with FIU-IND. Remembered: ${k} gambler payers${m.opt.device?", device "+m.opt.device:""}.`});
        action="CLOSED";
      }
      const score=Math.max(3,Math.min(98,Math.round(42+s.level*13-yes*22)));
      s.hist.push({w,sales:o.sales,proofSales,paid:paidNow,held,action,tests,extra,why,score,level:s.level,good:s.good,peer:b.sales,gapShare,catering:o.catering,bet:o.bet});
    }
    if(w==1) log.push({w,c:"good",t:"Every shop starts on Level 1. \"Normal\" is learned from the shops themselves. No fixed rules about round numbers or night-time payments."});
    if(w==10) log.push({w,c:"bad",t:"Two new bakeries open in Hyderabad. They look perfectly normal to the three questions. (Tick the answer key to see what they really are.)"});
    if(w==15) log.push({w,c:"good",t:"Festive season: bakeries spike together, so the comparison rises with them. Shops that bought stock a week early are already explained. No honest shop is held."});
    st.links=links;
  }
  return {st,log,met,memory,checks};
}
const fmt=n=>{n=Math.round(n);if(n>=100000)return(n/100000).toFixed(1)+"L";if(n>=1000)return Math.round(n/1000)+"k";return String(n)};

// ================= UI =================
const TABS=["dash","app","immune","db","how"];
let WEEK=1, SEL=1, TAB="dash", timer=null, TOUR=-1, LASTTAB=null;
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const PREV={};
const $=id=>document.getElementById(id);
const showTruth=()=>$("truth").checked;
const CITY=m=>`${m.cat[0].toUpperCase()+m.cat.slice(1)} in ${m.city}`;
function truth(m){return showTruth()?`<span class="truth tr-${m.type}">${{honest:"honest",renter:"rented out",mixer:"mixing bets",front:"betting front",stealth:"new trick"}[m.type]}</span>`:""}
function info(text){return `<button class="info" aria-label="What is this?" data-info="${text.replace(/"/g,'&quot;')}">?</button>`}
const ICON={play:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5v13l11-6.5z" fill="currentColor"/></svg>',pause:'<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4.5" height="14" rx="1" fill="currentColor"/><rect x="11.5" y="3" width="4.5" height="14" rx="1" fill="currentColor"/></svg>'};
const EVENTS=[[1,"Everyone on Level 1"],[10,"New trick appears"],[13,"System learns"],[15,"Festive season"],[18,"Results"]];

function render(){
  const R=run(WEEK);
  const w=$("week"); w.value=WEEK; w.style.setProperty("--p",((WEEK-1)/(WEEKS-1)*100)+"%");
  $("wknum").textContent="Week "+WEEK; $("wkdate").textContent=wkLabel(WEEK)+" 2026";
  document.querySelectorAll(".mark").forEach(b=>b.classList.toggle("on",+b.dataset.w<=WEEK));
  TABS.forEach(t=>{const b=$("tab-"+t);b.setAttribute("aria-selected",String(t===TAB));b.tabIndex=t===TAB?0:-1});
  const enter=LASTTAB!==TAB; LASTTAB=TAB;
  $("view").innerHTML=`<div class="view${enter?" enter":""}">${{dash,app,immune,how,db:database}[TAB](R)}</div>`;
  narrate(R); bindView(); animateNums(); animateBars();
}
// ---------- narration line under the time bar
function narrate(R){
  const pr={learn:0,bad:1,good:2};
  const here=R.log.filter(l=>l.w==WEEK).sort((a,b)=>pr[a.c]-pr[b.c]);
  let html,cls;
  if(here.length){html=here[0].t;cls=here[0].c}
  else{
    const hs=M.map(m=>R.st[m.id].hist[WEEK-1]).filter(Boolean), n=a=>hs.filter(h=>h.action==a).length;
    const parts=[]; if(n("ASK")) parts.push(`${n("ASK")} shop${n("ASK")>1?"s":""} asked a question`); if(n("SLOW")) parts.push(`${n("SLOW")} slowed`); if(n("STOP")) parts.push(`${n("STOP")} paused for review`);
    html=parts.length?`${parts.join(", ")}. Everyone else is paid as normal.`:"A quiet week. Every open shop is paid as normal, and steady weeks count towards the next level.";
    cls="calm";
  }
  const more=here.length>1?` <span class="more">and ${here.length-1} more in the log</span>`:"";
  const el=$("narr"), key=WEEK+"|"+html;
  if(el.dataset.k===key) return;
  el.dataset.k=key; el.className="narr "+cls; el.innerHTML=`<b class="nw">Week ${WEEK}</b>${html}${more}`;
  if(!RM){el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap")}
}
// ---------- smooth numbers and bars between weeks
function animateNums(){
  document.querySelectorAll("[data-c]").forEach(el=>{
    const k=el.dataset.c, to=+el.dataset.v, from=(k in PREV)?PREV[k]:to; PREV[k]=to;
    const f=el.dataset.k==="rs"?v=>"₹"+fmt(v):v=>String(Math.round(v));
    if(RM||from===to){el.textContent=f(to);return}
    const box=el.parentElement; box.classList.remove("bump"); void box.offsetWidth; box.classList.add("bump");
    const t0=performance.now(), D=650;
    const tick=now=>{if(!el.isConnected) return;const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1) requestAnimationFrame(tick)};
    el.textContent=f(from); requestAnimationFrame(tick);
  });
}
function animateBars(){
  document.querySelectorAll("[data-bar]").forEach(el=>{
    const k=el.dataset.bar, to=+el.dataset.to, from=(k in PREV)?PREV[k]:to; PREV[k]=to;
    if(RM||from===to){el.style.width=to+"%";return}
    el.style.transition="none"; el.style.width=from+"%"; void el.offsetWidth; el.style.transition=""; el.style.width=to+"%";
  });
}
const num=(id,v,kind)=>`<b data-c="${id}" data-v="${Math.round(v)}" data-k="${kind}">${kind=="rs"?"₹"+fmt(v):Math.round(v)}</b>`;

// ---------- PayU monitoring
function metricsHTML(R){
  const met=R.met, bad=M.filter(isBad).length;
  return `<section class="score" id="metrics" aria-label="Key numbers">
   <div class="grp"><h3>Catching betting money</h3><div class="ms">
     <div class="m">${num("bh",met.betHeld,"rs")}<span>of ₹${fmt(met.betTotal)} betting money held or stopped</span></div>
     <div class="m"><b><span data-c="st" data-v="${met.stopped}" data-k="n">${met.stopped}</span> of ${bad}</b><span>bad accounts stopped</span></div>
     <div class="m">${num("mx",met.mixedShopHeld,"rs")}<span>real sales held at shops caught mixing in bets, by design</span></div>
   </div></div>
   <div class="grp calm"><h3>Cost to honest shops</h3><div class="ms">
     <div class="m">${num("hd",met.honestDelayed,"rs")}<span>delayed at honest shops, never frozen</span></div>
     <div class="m">${num("ha",met.honestAsked.size,"n")}<span>honest shop${met.honestAsked.size==1?"":"s"} asked a question</span></div>
   </div></div></section>`;
}
function ladder(lv){return `<span class="lvl" aria-label="Level ${lv}">${[1,2,3,4].map(i=>`<i class="${i<=lv?(i==4?"on top":"on"):""}" style="height:${4+i*3}px"></i>`).join("")}</span> <span class="meta">L${lv}</span>`}
function dash(R){
  const rows=M.map(m=>{const h=R.st[m.id].hist[WEEK-1], sel=m.id==SEL;
    const nameCell=`<button class="mbtn" data-sel="${m.id}" aria-pressed="${sel}">${m.name}</button>${truth(m)}<div class="meta">${CITY(m)}</div>`;
    if(!h) return `<tr class="row${sel?" sel":""}" data-id="${m.id}"><td>${nameCell}</td><td colspan="4" class="meta">Not signed up yet</td><td><span class="pill NEW">Not open</span></td></tr>`;
    const gone=h.action=="CLOSED"||h.action=="BLOCKED";
    const tests=["S","C","N"].map(t=>`<span class="t ${h.tests.includes(t)?"on":""}" title="${{S:"Shape",C:"Control",N:"Network"}[t]}">${t}</span>`).join("")+(h.extra?`<span class="t r" title="Unanswered question">+${h.extra}</span>`:"");
    return `<tr class="row${sel?" sel":""}" data-id="${m.id}"><td>${nameCell}</td><td>${gone?"<span class='meta'>Removed</span>":ladder(h.level)}</td><td>${gone?"":tests}</td><td class="num">${gone?"":h.score}</td>
      <td class="meta num">₹${fmt(h.paid)} / <b style="color:${h.held>0?"#8E4A12":"inherit"}">₹${fmt(h.held)}</b></td><td><span class="pill ${h.action}">${h.action}</span></td></tr>`}).join("");
  return metricsHTML(R)+`<main class="dash">
  <div class="panel" id="p-table"><h2>Shops this week ${info("Every shop PayU serves, scored every week. S, C and N are the three questions: Shape (does the money look like this kind of shop?), Control (is the real owner running it?), Network (does it share customers with shops it shouldn't?). An orange +1 means a question went unanswered. 1 yes = ASK, 2 = SLOW, 3 = STOP.")}</h2>
   <div class="tablebox"><table><thead><tr><th>Shop</th><th>Trust level</th><th>Questions</th><th>Score</th><th>Paid / held</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="legend"><span><span class="t on">S</span>Shape</span><span><span class="t on">C</span>Control</span><span><span class="t on">N</span>Network</span><span><span class="t r">+1</span>Unanswered</span><span>1 yes: ASK, 2: SLOW, 3: STOP</span></div></div>
  <div class="side">
   <div class="panel" id="p-detail">${detail(R)}</div>
   <div class="panel" id="p-net"><h2>Who shares customers ${info("Each dot is a shop. A line means two shops shared 8 or more payers this week. Real shops have local customers, so they sit alone. Betting fronts share the same gamblers.")}</h2><svg viewBox="0 0 520 300" width="100%" role="img" aria-label="Network of shops sharing customers">${network(R)}</svg>
    <div class="legend"><span><i style="background:#B5432F"></i>Shared across cities</span><span><i style="background:#E3A33B"></i>Shared in one city</span><span>Click a dot to open that shop</span></div></div>
   <div class="panel" id="p-log"><h2>What the system did and learned ${info("A running log of every decision: questions asked, money slowed, accounts stopped, and every new thing the system learned. This week's entries are shaded.")}</h2><div class="log">${R.log.slice().reverse().map(l=>`<p class="${l.c}${l.w==WEEK?" now":""}"><span class="meta">W${l.w}</span> ${l.t}</p>`).join("")}</div></div>
  </div></main>`;
}
function detail(R){
  const m=M[SEL], H=R.st[m.id].hist.slice(0,WEEK), h=H[WEEK-1];
  let html=`<div class="ph"><div><h2 style="font-size:19px">${m.name}${truth(m)}</h2><div class="meta">${CITY(m)}</div></div> ${info("Sales (dark line) against sales backed by stock the shop bought (green), and what similar shops sell (grey dashes). Orange bars are money held back. Below: the reasons for this week's action.")}</div>`;
  if(!h) return html+`<p class="meta">Not signed up yet. It opens in week ${m.at}.</p>`;
  html+=`<div class="kv"><div><b>₹${fmt(h.sales)}</b><span>sales this week</span></div><div><b>₹${fmt(h.proofSales)}</b><span>backed by stock bought</span></div><div><b>₹${fmt(h.held)}</b><span>held back</span></div><div><b><span class="pill ${h.action}">${h.action}</span></b><span>action</span></div></div>`;
  html+=chart(H);
  html+=`<div class="legend"><span><i style="background:#12302C"></i>Sales</span><span><i style="background:#2E7D5B"></i>Backed by stock</span><span><i style="background:#B9CFC9"></i>Similar shops</span><span><i style="background:#C9772B;height:8px"></i>Held</span></div>`;
  html+=`<ul class="why">${(h.why&&h.why.length?h.why:["Money and behaviour match a real "+m.cat+". Nothing to do."]).map(x=>"<li>"+x+"</li>").join("")}</ul>`;
  return html;
}
function chart(H){
  const W=520,Ht=170,p=30, vals=H.filter(Boolean);
  const max=Math.max(...vals.map(h=>Math.max(h.sales,h.peer||0,h.proofSales||0)),1)*1.1;
  const x=i=>p+i*(W-p-8)/(WEEKS-1), y=v=>Ht-20-(v/max)*(Ht-34);
  const line=(f,col,dash)=>{let d="";H.forEach((h,i)=>{if(!h||!f(h))return;d+=(d?"L":"M")+x(i).toFixed(1)+","+y(f(h)).toFixed(1)});return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="5 5"':""}/>`:""};
  const bars=H.map((h,i)=>h&&h.held>0?`<rect x="${x(i)-5}" y="${y(h.held)}" width="10" height="${Ht-20-y(h.held)}" rx="2" fill="#C9772B" opacity=".75"/>`:"").join("");
  const ticks=[1,5,9,13,17].map(w=>`<text x="${x(w-1)}" y="${Ht-4}" font-size="10" fill="#596966" text-anchor="middle">W${w}</text>`).join("");
  const fest=`<rect x="${x(14)-6}" y="6" width="${x(16)-x(14)+12}" height="${Ht-26}" rx="6" fill="#FBEACB" opacity=".55"/><text x="${x(15)}" y="17" font-size="10" fill="#7A4E0E" text-anchor="middle">Festive</text>`;
  const now=`<line x1="${x(WEEK-1)}" x2="${x(WEEK-1)}" y1="6" y2="${Ht-20}" stroke="#E3A33B" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="Weekly sales, proof and held money for this shop">${fest}${now}<text x="2" y="14" font-size="10" fill="#596966">₹${fmt(max/1.1)}</text>${bars}${line(h=>h.peer,"#B9CFC9",true)}${line(h=>h.proofSales,"#2E7D5B")}${line(h=>h.sales,"#12302C")}${ticks}</svg>`;
}
function network(R){
  const pos={}, hy=M.filter(m=>m.city=="Hyderabad"), mu=M.filter(m=>m.city=="Mumbai");
  hy.forEach((m,i)=>pos[m.id]=[125+Math.cos(i/hy.length*Math.PI*2)*95,155+Math.sin(i/hy.length*Math.PI*2)*115]);
  mu.forEach((m,i)=>pos[m.id]=[395+Math.cos(i/mu.length*Math.PI*2)*85,155+Math.sin(i/mu.length*Math.PI*2)*110]);
  const col={OK:"#2E7D5B",ASK:"#E3A33B",SLOW:"#C9772B",STOP:"#B5432F",CLOSED:"#5a2a22",BLOCKED:"#3a1d18"};
  let s=`<circle cx="125" cy="155" r="132" fill="#F3F7F6"/><circle cx="395" cy="155" r="122" fill="#F3F7F6"/><text x="125" y="16" font-size="12" text-anchor="middle" fill="#596966" font-weight="600">Hyderabad</text><text x="395" y="16" font-size="12" text-anchor="middle" fill="#596966" font-weight="600">Mumbai</text>`;
  (R.st.links||[]).forEach(l=>{const a=pos[l[0]],b=pos[l[1]];s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${l[3]?"#B5432F":"#E3A33B"}" stroke-width="${Math.min(4,1+l[2]/15)}" opacity=".55" stroke-linecap="round"/>`});
  M.forEach(m=>{const h=R.st[m.id].hist[WEEK-1],p=pos[m.id],sel=m.id==SEL;s+=`<circle class="dot" data-sel="${m.id}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${sel?11:7.5}" fill="${h?col[h.action]:"#D5E0DC"}" stroke="${sel?"#12302C":"#fff"}" stroke-width="${sel?3:2}" style="cursor:pointer"><title>${m.name}${h?": "+h.action:""}</title></circle>`});
  return s;
}
// ---------- merchant app (the shop's point of view)
function app(R){
  if(APPMODE!=="sim") return appFlow();
  const m=M[SEL], s=R.st[m.id], h=s.hist[WEEK-1];
  const picker=`<div class="pick"><label class="meta" for="pick">Shop</label><select id="pick">${M.map(x=>`<option value="${x.id}" ${x.id==SEL?"selected":""}>${x.name}</option>`).join("")}</select></div>`;
  let body="";
  if(!h){body=`<div class="card"><h3>Not signed up yet</h3><p class="meta" style="margin:0">This shop joins in week ${m.at}.</p></div>`}
  else if(h.action=="BLOCKED"){body=`<div class="card bad"><h3>Sign-up couldn't be completed</h3><p style="margin:0">This phone is linked to an account that was closed for illegal betting collections.</p></div>`}
  else if(h.action=="CLOSED"){body=`<div class="card bad"><h3>Account closed</h3><p>After review, this account was closed for collecting payments for illegal betting. A report has been filed as required by law.</p><p class="meta" style="margin:0">If someone else was using your account, contact us: we'll help, and you won't face a case for reporting it.</p></div>`}
  else{
    const lv=h.level, need=lv<4?NEXT[lv]:null, prog=lv<4?Math.min(100,Math.round(h.good/need*100)):100;
    const firstWeek=(isNew(m)?m.at:1)==WEEK;
    if(firstWeek) body+=`<div class="card dark"><h3>Welcome to PayU</h3><p style="margin:0 0 6px">You start on <b>Level 1, Starter</b>. Take payments right away, with payouts sized to similar shops near you.</p><p style="margin:0;color:var(--soft)">Climb by showing you're a real shop: faster money, a badge, and a loan offer.</p></div>`;
    body+=`<div class="card"><div class="meta">Your trust level</div><h3>Level ${lv}: ${LEVELS[lv]}</h3><div class="steps">${[1,2,3,4].map(i=>`<span class="${i<lv?"on":i==lv?"cur":""}">${LEVELS[i]}</span>`).join("")}</div>${lv<4?`<div class="prog" role="progressbar" aria-label="Progress to the next level" aria-valuenow="${prog}" aria-valuemin="0" aria-valuemax="100"><i data-bar="prog${m.id}" data-to="${prog}" style="width:${prog}%"></i></div><div class="meta">${h.good} of ${need} steady weeks to reach ${LEVELS[lv+1]}</div>`:`<div class="meta">Top level reached</div>`}</div>`;
    body+=`<div class="card"><div class="meta">This week</div><h3>₹${fmt(h.paid)} paid ${lv==4?"instantly":"to your bank"}</h3>${h.held>0?`<p style="margin:0" class="meta">₹${fmt(h.held)} arrives in a few days. ${h.action=="SLOW"?"It's more than your usual business and we couldn't match it to your stock.":h.action=="STOP"?"Payouts are paused while we review.":"It's above your current limit; climbing a level raises it."}</p>`:`<p style="margin:0" class="meta">Nothing held back.</p>`}</div>`;
    if(h.action=="ASK"){body+=`<div class="card warn"><h3>Quick question</h3><p style="margin:0 0 8px">${h.catering?"We noticed an unusually large order this week. Started catering?":"We noticed something different this week. Can you tell us what changed?"}</p>${m.type=="honest"?`<p style="margin:0" class="meta">You replied: "office catering order", with the invoice. Thanks, all clear.</p>`:`<p style="margin:0" class="meta">No reply yet. Reply with a photo of your counter or a bill.</p>`}</div>`}
    if(h.action=="SLOW"||h.action=="STOP"){body+=`<div class="card bad"><h3>${h.action=="STOP"?"Payouts paused for review":"Warning"}</h3><p style="margin:0">${h.action=="STOP"?"Our team is reviewing recent payments on your account.":"Some payments don't match your shop. Renting out your QR or account is a crime, and you are responsible for every rupee. If someone else is using it, tell us and we'll close it with no case against you."}</p></div>`}
    const tasks=[["Take your first payment",true],["Pay a supplier from your account, or share a one-tap bank summary",lv>=2],["Record a 20-second shop video",lv>=3],["Link GST or Udyam, if you have one",lv>=3],["Keep it steady for a few months",lv>=4]];
    body+=`<div class="card"><div class="meta" style="margin-bottom:4px">Climb the ladder</div>${tasks.map(t=>`<div class="task${t[1]?" done":""}"><i aria-hidden="true">${t[1]?"✓":""}</i><span>${t[0]}${t[1]?'<span class="meta"> (done)</span>':""}</span></div>`).join("")}</div>`;
    if(lv>=3) body+=`<div class="card"><h3>Verified Shop badge</h3><p style="margin:0" class="meta">Customers see this badge when they scan your QR.</p></div>`;
    if(lv>=4) body+=`<div class="card dark"><h3>You're pre-approved</h3><p style="margin:0">A ₹50,000 working-capital loan, based on your payment history. No paperwork.</p></div>`;
  }
  return `<div class="two">
    <div>${appModes()}${picker}<div class="phone" aria-label="Merchant app for ${m.name}"><div class="bar"><span>PayU for Business</span><span>${wkLabel(WEEK)}</span></div><div class="shopname">${m.name}</div>${body}</div></div>
    <div class="explain"><h2>What the shop sees</h2>
      <p>The merchant never sees a "fraud score". It sees a level, its money and its offers. Checks arrive as questions, or as ways to unlock more.</p>
      <div class="tl">
        <div class="done"><b>Day 1: sign up.</b> Every shop starts on Level 1, with payouts sized to what similar shops nearby earn. No one starts as a suspect.</div>
        <div class="${WEEK>=6?"done":"now"}"><b>Weeks 1 to 6: just trade.</b> Steady weeks count towards Level 2. Proof is optional: a one-tap bank summary, or paying a supplier through the app.</div>
        <div class="${WEEK>=10?"done":"future"}"><b>Level 3: a shop video, GST or Udyam.</b> Unlocks a badge customers can see.</div>
        <div class="${WEEK>=14?"done":"future"}"><b>Level 4: Trusted.</b> Instant payouts, lowest fees and a loan offer.</div>
      </div>
      <div class="try"><b>Try one</b><div>
        <button class="ghost" data-go="app,10,3">Banjara Bun Co., week 10: a friendly question</button>
        <button class="ghost" data-go="app,10,5">Charminar Sweet Bakes, week 10: a warning</button>
        <button class="ghost" data-go="app,13,24">Link Road Accessories, week 13: blocked at sign-up</button>
        <button class="ghost" data-go="app,15,1">Ameerpet Oven House, week 15: Trusted, with a loan offer</button>
      </div></div>
      <p class="meta">Not climbing is fine: a shop that shares nothing stays on Level 1 and trades normally.</p>
    </div></div>`;
}
// ---------- immune system view
function immune(R){
  const stealth=M.filter(m=>m.type=="stealth");
  const status=m=>{const h=R.st[m.id].hist[WEEK-1];if(!h) return ["Not open yet","NEW"];if(h.action=="CLOSED"||h.action=="BLOCKED") return ["Stopped","CLOSED"];if(h.action=="OK") return ["Invisible: none of the three questions says yes","OK"];return [h.why.filter(x=>!x.startsWith("Shape")).slice(0,1).join(""),h.action]};
  const step=(cond,now)=>cond?(now?"now":"done"):"future";
  return `<div class="two" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
  <div class="explain"><h2>A new trick the system had never seen</h2>
    <p>Fronts adapt. In week 10, three new shops copy real bakeries perfectly: normal amounts, daytime payments, local-looking customers, and owners who stay in control. All three questions say no.</p>
    <div class="tl">
      <div class="${step(WEEK>=10,WEEK<13)}"><b>Weeks 10 to 12: infection.</b> The new fronts take bets unseen.</div>
      <div class="${step(WEEK>=13,WEEK==13)}"><b>Week 13: one case is found.</b> A cyber-crime report names Rose Cake Corner. An analyst confirms it.</div>
      <div class="${step(WEEK>=13,WEEK==13)}"><b>Week 13: the system learns.</b> It compares the confirmed case with honest bakeries and finds what's different: its payers keep hopping between shops in the same week. That becomes a new check.</div>
      <div class="${step(WEEK>=14,WEEK>=14&&WEEK<16)}"><b>Weeks 13 to 15: the look-alikes are caught.</b> The new check flags the other two. They can't answer the question, so it escalates: ask, then slow, then stop.</div>
      <div class="${step(WEEK>=16,WEEK>=16)}"><b>From then on:</b> every shop is checked for payer hopping.</div>
    </div>
    <div class="try"><b>Jump to</b><div><button class="ghost" data-go="immune,11">Week 11: unseen</button><button class="ghost" data-go="immune,13">Week 13: learns</button><button class="ghost" data-go="immune,15">Week 15: caught</button></div></div>
    <h3>The three new shops this week</h3>
    ${stealth.map(m=>{const [t,a]=status(m);return `<div class="chk"><span class="pill ${a}">${a=="NEW"?"Not open":a}</span><div><b>${m.name}</b>${truth(m)}<div class="meta">${t}</div></div></div>`}).join("")}
  </div>
  <div class="explain" id="checks"><h2>Checks the system runs</h2>

const TH={i:0,play:true,open:false};
function openTheatre(i=0){stop();closeWelcome();TH.i=i;TH.play=true;TH.open=true;let el=$("theatre");if(!el){el=document.createElement("div");el.id="theatre";el.className="theatre";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Story mode");document.body.appendChild(el)}drawTheatre();}
function closeTheatre(){TH.open=false;const el=$("theatre");if(el) el.remove();$("story").focus()}
function thGo(d){const n=TH.i+d;if(n<0) return;if(n>=SCENES.length){TH.play=false;drawTheatre();return}TH.i=n;drawTheatre()}
function drawTheatre(){
  const s=SCENES[TH.i], el=$("theatre"), acts=[...new Set(SCENES.map(x=>x.act))];
  const body=s.full?`<div class="th-full">${s.h}</div>`:`<div class="th-split"><div class="th-text"><p class="ti kick" style="--d:.1s">${s.act}</p><h2 class="ti" style="--d:.25s">${s.t}</h2><p class="ti tb" style="--d:.45s">${s.b}</p><div class="facts-in" style="--d:.9s">${s.f||""}</div></div><div class="th-vis">${s.v()}</div></div>`;
  el.innerHTML=`<div class="th-top"><div class="th-acts">${acts.map(a=>`<button class="${a==s.act?"on":""}" data-act="${a}">${a}</button>`).join("")}</div><button class="th-x" id="th-x" aria-label="Close story mode">×</button></div>
   <div class="th-stage" key="${TH.i}">${body}</div>
   <div class="th-bar"><button id="th-prev" aria-label="Previous scene">‹</button><button id="th-pp" class="th-pp" aria-label="${TH.play?"Pause":"Play"}">${TH.play?ICON.pause:ICON.play}</button><button id="th-next" aria-label="Next scene">›</button>
    <div class="th-dots">${SCENES.map((x,i)=>`<button class="${i<TH.i?"done":i==TH.i?"on":""}" data-sc="${i}" aria-label="Scene ${i+1}">${i==TH.i?`<i style="animation-duration:${x.dur}s;animation-play-state:${TH.play?"running":"paused"}"></i>`:""}</button>`).join("")}</div>
    <span class="th-n">${TH.i+1} of ${SCENES.length}</span></div>`;
  const bar=el.querySelector(".th-dots .on i"); if(bar) bar.addEventListener("animationend",()=>{if(TH.play&&TH.open) thGo(1)});
  if(RM&&bar) bar.style.animation="none";
  $("th-x").onclick=closeTheatre; $("th-prev").onclick=()=>thGo(-1); $("th-next").onclick=()=>thGo(1);
  $("th-pp").onclick=()=>{TH.play=!TH.play;const b=el.querySelector(".th-dots .on i");if(b) b.style.animationPlayState=TH.play?"running":"paused";el.classList.toggle("paused",!TH.play);$("th-pp").innerHTML=TH.play?ICON.pause:ICON.play;$("th-pp").setAttribute("aria-label",TH.play?"Pause":"Play")};
  el.classList.toggle("paused",!TH.play);
  el.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{TH.i=+b.dataset.sc;drawTheatre()});
  el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{TH.i=SCENES.findIndex(x=>x.act==b.dataset.act);drawTheatre()});
  el.querySelectorAll("[data-th]").forEach(n=>{const to=+n.dataset.th,t0=performance.now(),D=1600;const f=v=>Math.round(v).toLocaleString("en-IN");if(RM){n.textContent=f(to);return}const tick=t=>{if(!n.isConnected)return;const p=Math.min(1,(t-t0)/D);n.textContent=f(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
  if(RM) el.querySelectorAll("animateMotion").forEach(a=>a.remove());
  $("th-pp").focus({preventScroll:true});
}

  document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{const p=b.closest(".pmodal");if(APPMODE=="signup"){p.remove();return}RW.modal=RW.queue.length?RW.queue.shift():null;render()});
  document.querySelectorAll('[data-rw="reply"]').forEach(b=>b.onclick=()=>{RW.replied=true;RW.modal=["✅","Thanks, all clear","Catering noted. Large orders like this won't need a question next time.","Done"];render()});
  document.querySelectorAll('[data-rw="loan"]').forEach(b=>b.onclick=()=>{RW.loan=true;RW.modal=null;render()});
  const rp=$("rw-play");if(rp) rp.onclick=()=>{if(RW.timer){rwStop();return}if(RW.w>=rwWeeks().length) rwReset();rp.textContent="Pause";RW.modal=null;rwStep();if(!RW.modal&&RW.w<rwWeeks().length) RW.timer=setInterval(()=>{if(RW.modal) return;rwStep()},1500);const nb=$("rw-play");if(nb&&RW.timer) nb.textContent="Pause"};
  const rn=$("rw-next");if(rn) rn.onclick=()=>{rwStop();rwStep()};
  const rr=$("rw-reset");if(rr) rr.onclick=()=>{rwReset();render()};
  // database
  const t=$("dbt");if(t) t.onchange=()=>{DBF.type=t.value;DBF.sel=null;if(!DBF.cmp.startsWith("su")) DBF.cmp="none";render()};
  const c=$("dbc");if(c) c.onchange=()=>{DBF.city=c.value;DBF.sel=null;render()};
  const q=$("dbq");if(q) q.oninput=()=>{DBF.q=q.value;DBF.sel=null;clearTimeout(q._t);q._t=setTimeout(()=>{render();const n=$("dbq");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
  document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{DBF.size=b.dataset.size;DBF.sel=null;render()});
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;DBF.dir=DBF.sort==k?-DBF.dir:-1;DBF.sort=k;render()});
  document.querySelectorAll("[data-db]").forEach(r=>{const go=()=>{DBF.sel=+r.dataset.db;const seg=DB[DBF.sel];if(DBF.cmp.startsWith("sim")&&M[+DBF.cmp.slice(3)].cat!=seg.type) DBF.cmp="none";render();const n=document.querySelector(`[data-db="${DBF.sel}"]`);if(n) n.focus({preventScroll:true});const d=$("dbdetail");if(d&&d.getBoundingClientRect().top<150) d.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"})};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  const cm=$("dbcmp");if(cm) cm.onchange=()=>{DBF.cmp=cm.value;render()};
}
render();
try{if(!localStorage.getItem("et-tour")) welcome()}catch(e){}
</script>
